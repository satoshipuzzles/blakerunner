name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # The site has no build step — Vercel serves these files verbatim, so this is the only
    # thing standing between a typo and a blank game at forever21.lol.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - run: npm test
